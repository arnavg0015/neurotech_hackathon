<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evoke</title>
<style>
  :root { color-scheme: light; --ink: #252d29; --muted: #737d76; --line: #dfe5df; --yellow: #ffe6a0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6f3; color: var(--ink); font: 14px system-ui, sans-serif; }
  main { height: 100dvh; max-width: 1560px; margin: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 8px; }
  header, .controls, .chart-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header { flex: none; min-height: 32px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -1px; font-weight: 650; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .hero { flex: 0 0 clamp(216px, 30dvh, 280px); min-height: 0; display: grid; grid-template-columns: clamp(230px, 24vw, 300px) minmax(0, 1fr) clamp(230px, 24vw, 300px); align-items: center; background: white; border: 1px solid var(--line); border-radius: 14px; }
  .selector-wrap { height: 100%; min-height: 0; padding: 4px; text-align: center; }
  .selector { display: block; height: 100%; width: 100%; }
  .device { color: #747e77; }
  .device-card { fill: #fafbf9; stroke: #e0e5dd; stroke-width: 1; }
  .device.on { color: #926b15; }
  .device.on .device-card { fill: var(--yellow); stroke: #d5b055; filter: drop-shadow(0 0 5px #f6d66a55); }
  .device.selected .device-card { stroke: #4169a0; stroke-width: 3; }
  .device-name { fill: var(--ink); font: 600 14px system-ui; text-anchor: middle; }
  .word { font-size: 28px; font-weight: 600; letter-spacing: -.7px; overflow-wrap: anywhere; line-height: 1.25; }
  .model-flow { width: min(680px, 100%); margin: auto; padding: 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr); grid-template-rows: 62px 68px; align-items: stretch; gap: 12px; }
  .model-node { display: flex; align-items: center; justify-content: center; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fafbf9; color: var(--muted); text-align: center; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .model-node.active { background: var(--yellow); border-color: #d5b055; color: #705114; }
  .flow-link { color: #aaa795; font-size: 26px; text-align: center; align-self: center; }
  .model-input { display: flex; align-items: center; justify-content: center; min-width: 0; text-align: center; }
  .model-input.inactive { opacity: .4; }
  .activation-input { grid-row: 2; grid-column: 1; }
  .blink-input { grid-row: 2; grid-column: 3; }
  .eyes { width: 152px; height: 68px; color: var(--ink); }
  .eye-outline { fill: #fff; stroke: currentColor; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .eye-pupil { fill: currentColor; }
  .transport { flex: none; }
  .controls { margin-bottom: 6px; }
  .buttons { display: flex; gap: 6px; }
  button { font: inherit; padding: 7px 16px; border-radius: 7px; border: 1px solid #cdd6cd; background: white; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: white; border-color: var(--ink); }
  button:hover:not(:disabled) { filter: brightness(.94); }
  button:focus-visible { outline: 3px solid #d5b055; outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: default; }
  .clock { font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
  progress { display: block; width: 100%; height: 3px; border: 0; border-radius: 3px; overflow: hidden; background: #e1e6df; accent-color: #b7a26c; }
  progress::-webkit-progress-bar { background: #e1e6df; }
  progress::-webkit-progress-value { background: #b7a26c; }
  .chart { flex: 1; min-height: 0; display: flex; flex-direction: column; background: white; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px 5px; }
  .chart-heading { flex: none; margin-bottom: 4px; font-size: 12px; }
  .chart-heading strong { font-weight: 600; }
  .legend { color: var(--muted); }
  .legend::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #b89945; margin-right: 6px; }
  .plot { flex: 1; min-height: 0; position: relative; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #error { flex: none; background: #fff0e9; border: 1px solid #e6b7a6; padding: 8px; border-radius: 7px; color: #803821; }
  @media (max-height: 700px) {
    main { padding: 8px 16px; gap: 6px; }
    header { min-height: 28px; } h1 { font-size: 26px; }
    .hero { flex-basis: 196px; }
    .word { font-size: 24px; }
    button { padding: 5px 14px; }
  }
  @media (max-width: 1000px) {
    .hero { grid-template-columns: 220px minmax(0, 1fr); }
    .model-flow { padding: 12px; }
  }
  @media (max-width: 700px) {
    main { padding: 8px; }
    .hero { grid-template-columns: minmax(150px, .8fr) minmax(0, 1.2fr); flex-basis: 220px; }
    .word { font-size: 20px; }
    .model-flow { padding: 8px; gap: 4px; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr); }
    .model-node { padding: 5px; font-size: 12px; overflow-wrap: anywhere; }
    .flow-link { font-size: 20px; }
    .eyes { width: 100%; }
    .chart { padding: 7px 6px 4px; } .chart-heading { font-size: 10px; }
    .clock { font-size: 11px; } button { padding: 6px 10px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Evoke</h1>
  </header>
  <section class="hero" aria-label="Appliances, stimulus, and active model">
    <div class="selector-wrap">
      <svg id="selector" class="selector" viewBox="0 0 320 320" role="img" aria-label="Six appliances, waiting for activation">
        <defs>
          <g id="icon-light" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18h6m-5 3h4M8 14a7 7 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2Z"/>
          </g>
          <g id="icon-fan" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <circle cx="12" cy="12" r="2"/>
            <path d="M10 10C6 2 16 0 17 5c.5 3-2 5-3 6M14 12c9 0 6 10 2 8-3-1-4-4-4-6M11 14C7 22 0 15 4 11c2-2 5-1 6 0"/>
          </g>
          <g id="icon-tv" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 22h8m-4-4v4"/>
          </g>
          <g id="icon-speaker" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="7" r="1.3"/><circle cx="12" cy="15" r="4"/>
          </g>
          <g id="icon-heater" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 8v8m5-8v8m5-8v8M6 19v3m12-3v3M6 2v1m6-1v1m6-1v1"/>
          </g>
          <g id="icon-kettle" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 6h10v10a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-5L1 8h6m10 0h2a3 3 0 0 1 0 6h-2M9 3h6m-3 0V1M5 23h13"/>
          </g>
        </defs>
        <g id="devices"></g>
        <g id="arrow" opacity="0.2" transform="rotate(0 160 150)">
          <path d="M160 150V111m-6 8 6-9 6 9" fill="none" stroke="#6c6758" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="160" cy="150" r="4" fill="#6c6758"/>
        </g>
      </svg>
    </div>
    <div class="model-flow" role="group" aria-label="Model flow and recorded cues">
      <div id="activation-model" class="model-node">Activation Model</div>
      <span class="flow-link" aria-hidden="true">⇄</span>
      <div id="blink-model" class="model-node">Double Blink Model</div>
      <div class="model-input activation-input" aria-live="polite">
        <p id="word" class="word">Loading…</p>
      </div>
      <div class="model-input blink-input">
        <svg id="eyes" class="eyes" viewBox="0 0 160 68" role="img" aria-label="Eyes open">
          <g transform="translate(40 34)"><g class="eye-shape">
            <path class="eye-outline" d="M-27 0Q0-25 27 0Q0 25-27 0Z"/>
            <circle class="eye-pupil" r="8"/>
          </g></g>
          <g transform="translate(120 34)"><g class="eye-shape">
            <path class="eye-outline" d="M-27 0Q0-25 27 0Q0 25-27 0Z"/>
            <circle class="eye-pupil" r="8"/>
          </g></g>
        </svg>
      </div>
    </div>
  </section>
  <div id="error" role="alert" hidden></div>
  <div class="transport">
  <div class="controls">
    <div class="buttons">
      <button id="play" class="primary" disabled>Play</button>
      <button id="pause" disabled>Pause</button>
      <button id="restart" disabled>Restart</button>
    </div>
    <div id="clock" class="clock">Activation · 00:00.0 / 01:00.0</div>
  </div>
  <progress id="progress" value="0" max="60" aria-label="Replay progress"></progress>
  </div>
  <section class="chart" aria-label="EEG signal and stimulus timeline">
    <div class="chart-heading"><strong>EEG Stream <span class="muted">/ Last 10 Seconds · µV</span></strong><div id="legend-label" class="legend">Activation Detected</div></div>
    <div class="plot"><canvas id="signal" role="img" aria-label="Scrolling EEG traces for all 21 channels with word and blank segments"></canvas></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const canvas = $("signal"), ctx = canvas.getContext("2d");
const appliances = ["Light", "Fan", "TV", "Speaker", "Heater", "Kettle"];
const initialStates = [false, true, false, true, false, true];
let applianceStates = [...initialStates];
let sessions = {}, session = null, stage = "activation", eligible = [];
let time = 0, playing = false, finished = false, failed = false, generation = 0;
let nextPrediction = 0, pending = null, held = null, latest = null, selectedAppliance = null;
let markers = [], lastTick = performance.now(), lastDraw = 0;
let positions = {}, selectionStart = 0, selectionRemaining = 0;

function clock(seconds) {
  const tenths = Math.floor(Math.max(0, seconds) * 10 + 1e-7);
  return `${String(Math.floor(tenths / 600)).padStart(2, "0")}:${String(Math.floor(tenths / 10) % 60).padStart(2, "0")}.${tenths % 10}`;
}
function text(id, value) { if ($(id).textContent !== value) $(id).textContent = value; }
function displayWord(word) { return word.toLowerCase() === "na" ? "NA" : word.toLowerCase().replace(/\b[a-z]/g, letter => letter.toUpperCase()); }
function eyeOpenness(elapsed) {
  for (const start of [0, .36]) {
    const phase = elapsed - start;
    if (phase >= 0 && phase < .1) return Math.max(.04, 1 - phase / .1);
    if (phase >= .1 && phase < .18) return .04;
    if (phase >= .18 && phase < .28) return Math.max(.04, (phase - .18) / .1);
  }
  return 1;
}
function fail(message) {
  playing = false; failed = true;
  $("error").textContent = message + " Restart to try again.";
  $("error").hidden = false;
  render();
}
async function predict(event) {
  const run = generation, requestStage = stage, controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  pending = controller;
  try {
    const response = await fetch("/api/predict", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({stage: requestStage, event_id: event.id}), signal: controller.signal
    });
    const result = await response.json();
    if (run !== generation) return;
    if (!response.ok) throw new Error(result.error || "Inference failed.");
    if (result.stage !== requestStage || result.event_id !== event.id || ![0, 1].includes(result.predicted)) throw new Error("Unexpected model response.");
    held = result;
  } catch (error) {
    if (run === generation) fail(error.name === "AbortError" ? "Model request timed out." : error.message);
  } finally {
    clearTimeout(timeout);
    if (run === generation) pending = null;
  }
}
function useStage(nextStage) {
  if (session) positions[stage] = {time, nextPrediction, latest, markers};
  generation++; pending?.abort(); pending = null; held = null;
  stage = nextStage; session = sessions[stage];
  eligible = session.events.filter(e => e.ready_at !== null).sort((a, b) => a.ready_at - b.ready_at);
  ({time, nextPrediction, latest, markers} = positions[stage] ?? {time: 0, nextPrediction: 0, latest: null, markers: []});
  selectionStart = time; selectionRemaining = 0; selectedAppliance = null; finished = false;
  $("progress").max = session.duration; lastTick = performance.now();
}
function pointedAppliance() { return selectedAppliance ?? (stage === "blink" ? Math.floor(Math.max(0, time - selectionStart)) % 6 + 1 : 1); }
function applyPrediction(result) {
  if (result.stage !== stage) return;
  latest = result;
  if (result.predicted !== 1 || time >= session.duration) return;
  markers.push({time, event_id: result.event_id});
  if (stage === "activation") { useStage("blink"); return; }
  selectedAppliance = pointedAppliance(); selectionRemaining = 1;
  applianceStates[selectedAppliance - 1] = !applianceStates[selectedAppliance - 1];
}
function start() {
  if (!session || failed || finished) return;
  playing = true; lastTick = performance.now(); render();
}
function pause() { playing = false; render(); }
function restart() {
  if (!sessions.activation || !sessions.blink) return location.reload();
  positions = {}; session = null; applianceStates = [...initialStates];
  useStage("activation"); playing = false; failed = false;
  $("error").hidden = true; render(); draw();
}
function render() {
  const pointed = pointedAppliance();
  $("arrow").setAttribute("transform", `rotate(${(pointed - 1) * 60} 160 150)`);
  $("arrow").setAttribute("opacity", stage === "blink" ? "1" : "0.2");
  document.querySelectorAll(".device").forEach((device, i) => {
    device.classList.toggle("on", applianceStates[i]);
    device.classList.toggle("selected", selectedAppliance === i + 1);
    device.setAttribute("aria-label", `${appliances[i]} ${applianceStates[i] ? "On" : "Off"}`);
  });
  for (const name of ["activation", "blink"]) {
    const node = $(`${name}-model`), current = !!session && !finished && !failed && stage === name;
    node.classList.toggle("active", current);
    if (current) node.setAttribute("aria-current", "step");
    else node.removeAttribute("aria-current");
  }
  $("selector").setAttribute("aria-label", appliances.map((name, i) => `${name} ${applianceStates[i] ? "On" : "Off"}`).join(", ") +
    (stage === "blink" ? `. Arrow pointing at ${appliances[pointed - 1]}.` : ". Waiting for activation."));
  $("play").disabled = !session || playing || finished || failed;
  $("pause").disabled = !playing;
  $("restart").disabled = !session && !failed;
  if (!session) return;
  const event = session.events.find(e => e.start <= time && e.end > time) || session.events.at(-1);
  const activationTime = stage === "activation" ? time : positions.activation?.time ?? 0;
  const wordEvent = sessions.activation.events.find(e => e.start <= activationTime && e.end > activationTime) || sessions.activation.events.at(-1);
  text("word", displayWord(wordEvent.word));
  const blinkCue = stage === "blink" && event.word.toLowerCase() === "double blink";
  const openness = blinkCue ? eyeOpenness(time - event.start) : 1;
  document.querySelectorAll(".eye-shape").forEach(eye => eye.setAttribute("transform", `scale(1 ${openness})`));
  $("eyes").setAttribute("aria-label", blinkCue ? "Recorded double-blink cue" : "Eyes open");
  document.querySelector(".activation-input").classList.toggle("inactive", stage !== "activation");
  document.querySelector(".blink-input").classList.toggle("inactive", stage !== "blink");
  text("legend-label", stage === "activation" ? "Activation Detected" : "Double Blink Detected");
  text("clock", `${stage === "activation" ? "Activation" : "Blink"} · ${clock(time)} / ${clock(session.duration)}`);
  $("progress").value = time;
}
function draw() {
  const width = canvas.clientWidth, height = canvas.clientHeight, ratio = window.devicePixelRatio || 1;
  if (!width || !height) return;
  if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
    canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
  }
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  if (!session) return;
  const left = 84, right = width - 12, top = 44, rowHeight = (height - top - 20) / session.channels.length;
  const bottom = top + rowHeight * session.channels.length;
  const start = Math.max(0, time - 10), x = t => left + (t - start) / 10 * (right - left);
  const cursor = x(time), signal = session.signal;
  ctx.font = "10px system-ui"; ctx.textBaseline = "middle";
  for (let second = Math.ceil(start); second <= start + 10; second++) {
    ctx.strokeStyle = "#eeefe9"; ctx.beginPath(); ctx.moveTo(x(second), top); ctx.lineTo(x(second), bottom); ctx.stroke();
    ctx.fillStyle = "#85897f"; ctx.textAlign = "center"; ctx.fillText(`${second}s`, x(second), bottom + 15);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(left, 0, right - left, bottom); ctx.clip();
  for (const event of session.events) {
    if (event.end <= start || event.start >= time) continue;
    const a = Math.max(left, x(event.start)), b = Math.min(cursor, x(event.end));
    ctx.fillStyle = event.kind === "blank" ? "#f0f1eb" : "#e2e5d9";
    ctx.fillRect(a, 4, b - a, 23);
    ctx.strokeStyle = "white"; ctx.strokeRect(a, 4, b - a, 23);
    ctx.save(); ctx.beginPath(); ctx.rect(a + 3, 4, Math.max(0, b - a - 6), 23); ctx.clip();
    ctx.fillStyle = "#454c3b"; ctx.textAlign = "left";
    ctx.fillText(displayWord(event.word), a + 6, 16); ctx.restore();
    if (event.ready_at === null) {
      ctx.strokeStyle = "#a5a99b"; ctx.setLineDash([2, 3]); ctx.beginPath();
      ctx.moveTo(a, 29); ctx.lineTo(b, 29); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  for (const marker of markers) {
    if (marker.time < start || marker.time > time) continue;
    ctx.fillStyle = "#b89945"; ctx.beginPath(); ctx.arc(x(marker.time), 36, 3, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = "#e6c66c"; ctx.setLineDash([2, 4]); ctx.beginPath();
    ctx.moveTo(x(marker.time), top); ctx.lineTo(x(marker.time), bottom); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const join of session.joins || []) {
    if (join <= start || join >= time) continue;
    ctx.strokeStyle = "#adb7ad"; ctx.setLineDash([3, 3]); ctx.beginPath();
    ctx.moveTo(x(join), 3); ctx.lineTo(x(join), bottom); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
  const breaks = new Set((session.joins || []).map(join => Math.round((join - signal.start) / signal.step)));
  const first = Math.max(0, Math.floor((start - signal.start) / signal.step));
  const last = Math.min(signal.min[0].length, Math.floor((time - signal.start) / signal.step));
  session.channels.forEach((channel, ch) => {
    const y = top + (ch + .5) * rowHeight, amplitude = rowHeight * .43, scale = signal.scales[ch];
    ctx.fillStyle = "#454c3b"; ctx.font = "10px system-ui"; ctx.textAlign = "left"; ctx.fillText(channel, 0, y);
    ctx.fillStyle = "#737d76"; ctx.textAlign = "right"; ctx.fillText(`±${scale}`, left - 8, y);
    ctx.strokeStyle = "#edf0e8"; ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(left, y - rowHeight / 2, right - left, rowHeight); ctx.clip();
    ctx.strokeStyle = "#383f31"; ctx.lineWidth = .8; ctx.beginPath();
    for (let i = first; i < last; i++) {
      const px = x(signal.start + (i + 1) * signal.step);
      const low = Math.max(-1, Math.min(1, signal.min[ch][i] / scale));
      const high = Math.max(-1, Math.min(1, signal.max[ch][i] / scale));
      if (i === first || breaks.has(i)) ctx.moveTo(px, y - low * amplitude);
      else ctx.lineTo(px, y - low * amplitude);
      ctx.lineTo(px, y - high * amplitude);
    }
    ctx.stroke(); ctx.restore();
  });
  ctx.strokeStyle = "#7a826c"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cursor, 3); ctx.lineTo(cursor, bottom); ctx.stroke();
}
function frame(now) {
  if (playing) {
    const elapsed = Math.max(0, now - lastTick) / 1000;
    if (selectedAppliance !== null) {
      selectionRemaining = Math.max(0, selectionRemaining - elapsed);
      if (selectionRemaining === 0) useStage("activation");
    } else {
      time = Math.min(session.duration, time + elapsed);
      if (held) { const result = held; held = null; applyPrediction(result); }
      if (playing && selectedAppliance === null && !pending && nextPrediction < eligible.length && eligible[nextPrediction].ready_at <= time) {
        predict(eligible[nextPrediction++]);
      }
      if (playing && selectedAppliance === null && time >= session.duration && !pending && !held && nextPrediction === eligible.length) {
        playing = false; finished = true;
      }
    }
  }
  lastTick = now;
  if (now - lastDraw >= 33) { render(); draw(); lastDraw = now; }
  requestAnimationFrame(frame);
}
$("play").addEventListener("click", start);
$("pause").addEventListener("click", pause);
$("restart").addEventListener("click", restart);
window.addEventListener("resize", draw);
new ResizeObserver(draw).observe(canvas.parentElement);
document.addEventListener("visibilitychange", () => { if (document.hidden && playing) pause(); });

for (let i = 0; i < 6; i++) {
  const angle = i * Math.PI / 3, x = 160 + Math.sin(angle) * 110, y = 150 - Math.cos(angle) * 110;
  $("devices").insertAdjacentHTML("beforeend", `<g id="appliance-${i + 1}" class="device" transform="translate(${x} ${y})">
    <rect class="device-card" x="-43" y="-26" width="86" height="70" rx="12"/>
    <use href="#icon-${appliances[i].toLowerCase()}" transform="translate(-14 -18) scale(1.17)"/>
    <text class="device-name" x="0" y="29">${appliances[i]}</text></g>`);
}
async function load() {
  try {
    const entries = await Promise.all(["activation", "blink"].map(async name => {
      const response = await fetch(`/api/session?stage=${name}`);
      if (!response.ok) throw new Error(`Could not load the ${name} recording from the Python server.`);
      const data = await response.json();
      if (data.stage !== name || data.channels.length !== 21) throw new Error("Unexpected replay data. Restart the Python server.");
      return [name, data];
    }));
    sessions = Object.fromEntries(entries); useStage("activation");
    render(); draw();
  } catch (error) { fail(error.message); }
}
load();
requestAnimationFrame(frame);
</script>
</body>
</html>
